name: Update Skland Data

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:
    inputs:
      fast_mode:
        description: 'Enable fast mode (concurrency=2, sleep=500ms)'
        type: boolean
        default: false
      unlimited_speed:
        description: 'Enable unlimited speed (concurrency=10, sleep=0ms)'
        type: boolean
        default: false
      skip_crawl:
        description: 'Skip crawling (only rebuild)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm install
      - run: npm run all
        env:
          SKLAND_DEVICE_ID: ${{ secrets.SKLAND_DEVICE_ID }}
          CRAWL_FAST_MODE: ${{ github.event.inputs.fast_mode }}
          CRAWL_UNLIMITED: ${{ github.event.inputs.unlimited_speed }}
          SKIP_CRAWL: ${{ github.event.inputs.skip_crawl }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skland-pack
          path: dist/
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
